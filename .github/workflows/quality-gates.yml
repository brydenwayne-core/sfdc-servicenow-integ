name: Salesforce Quality Gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_changed: ${{ steps.filter.outputs.docs }}
      salesforce_changed: ${{ steps.filter.outputs.salesforce }}
      workflow_changed: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed file groups
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - '**/*.md'
            salesforce:
              - 'force-app/**'
              - 'manifest/**'
              - 'manifests/**'
              - 'sfdx-project.json'
              - 'scripts/ci/**'
            workflow:
              - '.github/workflows/**'

      - name: Classify validation path
        id: classify
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.filter.outputs.docs }}" == 'true' && "${{ steps.filter.outputs.salesforce }}" != 'true' && "${{ steps.filter.outputs.workflow }}" != 'true' ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Change summary
        run: |
          echo "Docs changed: ${{ steps.filter.outputs.docs }}"
          echo "Salesforce changed: ${{ steps.filter.outputs.salesforce }}"
          echo "Workflow changed: ${{ steps.filter.outputs.workflow }}"
          echo "Docs only: ${{ steps.classify.outputs.docs_only }}"

  docs-quality-gates:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate markdown docs
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"


  salesforce-quality-gates:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    env:
      SF_TARGET_ORG: ${{ secrets.SF_TARGET_ORG }}
      SF_DEVHUB_ALIAS: ${{ secrets.SF_DEVHUB_ALIAS }}
      SF_WAIT_MINUTES: 45
      SF_TEST_LEVEL: RunLocalTests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install Salesforce Code Analyzer plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Authenticate target org
        if: ${{ secrets.SF_AUTH_URL != '' && env.SF_TARGET_ORG != '' }}
        run: |
          printf '%s' "$SF_AUTH_URL" > ./auth-url.txt
          sf org login sfdx-url --sfdx-url-file ./auth-url.txt --alias "$SF_TARGET_ORG" --set-default
        env:
          SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}

      - name: Authenticate Dev Hub
        if: ${{ secrets.SF_DEVHUB_AUTH_URL != '' && env.SF_DEVHUB_ALIAS != '' }}
        run: |
          printf '%s' "$SF_DEVHUB_AUTH_URL" > ./devhub-auth-url.txt
          sf org login sfdx-url --sfdx-url-file ./devhub-auth-url.txt --alias "$SF_DEVHUB_ALIAS"
        env:
          SF_DEVHUB_AUTH_URL: ${{ secrets.SF_DEVHUB_AUTH_URL }}

      - name: Static analysis
        run: ./scripts/ci/static-analysis.sh

      - name: Apex tests
        if: ${{ env.SF_TARGET_ORG != '' }}
        run: ./scripts/ci/apex-tests.sh

      - name: Metadata validation
        if: ${{ env.SF_TARGET_ORG != '' }}
        run: ./scripts/ci/validate-metadata.sh

      - name: Package checks
        run: ./scripts/ci/package-checks.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf-quality-gate-reports
          path: reports/
